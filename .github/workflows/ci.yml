name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Run API and leakage tests
        run: python -m unittest tests.test_phase8_api tests.test_phase7f_experiment tests.test_phase9_simulation -v
      - name: Validate Phase 7F selection and final evaluation
        run: python scripts/validate_phase7f_selection.py && python scripts/validate_phase7f_final_test_report.py
      - name: Validate simulated Phase 9 artifacts
        run: python scripts/build_phase9_simulated_scenario.py --check && python scripts/validate_phase9_simulation.py
      - name: Validate runtime configuration and secret boundaries
        run: python scripts/validate_runtime_config.py
      - name: Build web console
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build API container
        run: docker build -f api/Dockerfile -t jk-disaster-api:ci .
      - name: Build web container
        run: docker build -f frontend/Dockerfile -t jk-disaster-web:ci frontend
